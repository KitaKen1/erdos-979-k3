name = "erdos979"
version = "0.1.0"
keywords = ["math", "erdos", "prime-cubes"]
defaultTargets = ["K3Lean"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "db127794c79fdeb86f6b0cf6ff2c804026fbaff1"

[[require]]
name = "PrimeNumberTheoremAnd"
git = "https://github.com/AlexKontorovich/PrimeNumberTheoremAnd.git"
rev = "6739793850d3eaa031e3543ed72d7f026f8080f5"

[[lean_lib]]
name = "K3Lean"
